<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Studio — Mesh Gradient Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07070c;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-hover: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #ffffff;
    --muted: #8b8b9a;
    --muted-strong: #c9c9d4;
    --success: #4ade80;
    --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 0 100px rgba(196, 181, 253, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 20% -10%, rgba(196, 181, 253, 0.14), transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 110%, rgba(99, 102, 241, 0.10), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    padding: 24px;
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    animation: fadeIn 0.6s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 56px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: conic-gradient(from 220deg, #c4b5fd, #f0abfc, #fbbf24, #4ade80, #60a5fa, #c4b5fd);
    box-shadow: 0 0 30px rgba(196, 181, 253, 0.45);
    position: relative;
    animation: spin 18s linear infinite;
  }

  .logo-mark::after {
    content: '';
    position: absolute;
    inset: 6px;
    background: var(--bg);
    border-radius: 5px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    padding: 5px 10px;
    border-radius: 999px;
    background: linear-gradient(135deg, #c4b5fd, #f0abfc);
    color: #0a0a0f;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }

  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, #ffffff, #e7e7ef);
    color: #0a0a0f;
    border-color: transparent;
    font-weight: 600;
  }

  .btn-primary:hover {
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.18);
  }

  /* HERO */
  .hero {
    text-align: center;
    margin-bottom: 48px;
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px;
    color: var(--muted-strong);
    margin-bottom: 24px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .hero-eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .hero h1 {
    font-size: clamp(38px, 6vw, 68px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 18px;
    background: linear-gradient(180deg, #fff 30%, #8b8b9a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p {
    color: var(--muted);
    font-size: 16px;
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* CANVAS */
  .canvas-wrap {
    position: relative;
    aspect-ratio: 16/9;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow-lg), var(--shadow-glow);
    margin-bottom: 24px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .canvas-wrap:hover {
    transform: translateY(-4px);
  }

  .canvas {
    width: 100%;
    height: 100%;
    transition: background-image 0.7s ease, background-color 0.7s ease;
    animation: breathe 14s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .canvas-overlay {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .canvas-hint {
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .canvas-hint kbd {
    padding: 2px 7px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
  }

  /* CONTROLS */
  .controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    margin-bottom: 56px;
    align-items: center;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    padding-left: 8px;
  }

  .control {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .control-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }

  .preset-selector {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .preset-btn {
    padding: 7px 12px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .preset-btn:hover { color: var(--text); }
  .preset-btn.active {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
  }

  .slider {
    width: 110px;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--border-strong);
    border-radius: 2px;
    outline: none;
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.15s;
  }

  .slider::-webkit-slider-thumb:hover { transform: scale(1.15); }

  .slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .slider-value {
    font-size: 12px;
    color: var(--muted-strong);
    font-variant-numeric: tabular-nums;
    width: 12px;
    font-weight: 600;
  }

  .action-group {
    display: flex;
    gap: 6px;
  }

  /* LIBRARY */
  .library-section {
    margin-bottom: 64px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .section-meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }

  .library-item {
    aspect-ratio: 16/9;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    animation: popIn 0.4s ease both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .library-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
    border-color: var(--border-strong);
  }

  .library-item .thumb {
    width: 100%;
    height: 100%;
  }

  .library-item .actions {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .library-item:hover .actions { opacity: 1; }

  .icon-btn {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.22);
    cursor: pointer;
    transition: all 0.15s;
  }

  .icon-btn:hover {
    background: rgba(255,255,255,0.28);
    transform: scale(1.08);
  }

  .icon-btn.danger:hover {
    background: rgba(239, 68, 68, 0.55);
    border-color: rgba(239, 68, 68, 0.7);
  }

  .library-empty {
    grid-column: 1 / -1;
    padding: 56px 24px;
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* FOOTER */
  footer {
    padding: 32px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  footer .links {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-top: 4px;
  }

  footer .links a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }

  footer .links a:hover { color: var(--text); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 18px 12px 14px;
    background: rgba(18, 18, 24, 0.95);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast .check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--success);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #0a0a0f;
    flex-shrink: 0;
  }

  /* RESPONSIVE */
  @media (max-width: 880px) {
    .controls {
      grid-template-columns: 1fr;
    }
    .control-group {
      padding-left: 0;
      gap: 14px;
    }
    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      width: 100%;
    }
    .action-group .btn { justify-content: center; }
  }

  @media (max-width: 560px) {
    body { padding: 16px; }
    header { padding-bottom: 32px; }
    .nav .btn:not(.btn-primary) { display: none; }
    .canvas-hint { font-size: 11px; padding: 6px 10px; }
    .preset-selector { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-mark"></div>
        AURORA
      </div>
      <div class="nav">
        <span class="badge">Pro</span>
        <button class="btn" data-fake="signin">Sign in</button>
        <button class="btn btn-primary" data-fake="upgrade">Upgrade</button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-eyebrow">
        <span class="dot"></span>
        <span id="user-count">12,847</span>명의 디자이너가 사용 중
      </div>
      <h1>Mesh Gradients,<br/>just one click away.</h1>
      <p>아름다운 메쉬 그라디언트를 한 번의 클릭으로. 마음에 드는 색감을 골라 CSS로 복사하거나 PNG로 다운받으세요.</p>
    </section>

    <div class="canvas-wrap" id="canvas-wrap">
      <div class="canvas" id="canvas"></div>
      <div class="canvas-overlay">
        <div class="canvas-hint">
          <kbd>Space</kbd>
          또는 클릭으로 새 그라디언트
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <div class="control">
          <span class="control-label">Style</span>
          <div class="preset-selector" id="presets">
            <button class="preset-btn active" data-preset="aurora">Aurora</button>
            <button class="preset-btn" data-preset="sunset">Sunset</button>
            <button class="preset-btn" data-preset="ocean">Ocean</button>
            <button class="preset-btn" data-preset="cyberpunk">Cyber</button>
            <button class="preset-btn" data-preset="pastel">Pastel</button>
            <button class="preset-btn" data-preset="forest">Forest</button>
          </div>
        </div>
        <div class="control">
          <span class="control-label">Layers</span>
          <input type="range" class="slider" id="complexity" min="3" max="8" value="5" />
          <span class="slider-value" id="complexity-value">5</span>
        </div>
      </div>
      <div class="action-group">
        <button class="btn" id="save-btn" title="라이브러리에 저장">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save
        </button>
        <button class="btn" id="copy-btn" title="CSS 코드 복사">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy CSS
        </button>
        <button class="btn btn-primary" id="png-btn" title="PNG 다운로드">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PNG
        </button>
      </div>
    </div>

    <section class="library-section">
      <div class="section-header">
        <h2 class="section-title">Your Library</h2>
        <span class="section-meta" id="library-count">0개의 저장된 그라디언트</span>
      </div>
      <div class="library-grid" id="library"></div>
    </section>

    <footer>
      <div>Made with care · Aurora Studio © 2026</div>
      <div class="links">
        <a href="#" data-fake="docs">Docs</a>
        <a href="#" data-fake="changelog">Changelog</a>
        <a href="#" data-fake="pricing">Pricing</a>
        <a href="#" data-fake="twitter">Twitter</a>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast">
    <span class="check">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <span id="toast-text">Saved</span>
  </div>

<script>
  const PRESETS = {
    aurora: {
      base: '#0a0f1c',
      colors: ['#4ade80', '#60a5fa', '#a78bfa', '#f0abfc', '#34d399', '#22d3ee']
    },
    sunset: {
      base: '#1c0a14',
      colors: ['#fb923c', '#f472b6', '#a78bfa', '#fbbf24', '#ef4444', '#ec4899']
    },
    ocean: {
      base: '#0a1428',
      colors: ['#06b6d4', '#0ea5e9', '#3b82f6', '#14b8a6', '#22d3ee', '#0284c7']
    },
    cyberpunk: {
      base: '#16041f',
      colors: ['#ec4899', '#a855f7', '#3b82f6', '#22d3ee', '#f0abfc', '#d946ef']
    },
    pastel: {
      base: '#1c1c22',
      colors: ['#fce7f3', '#dbeafe', '#d1fae5', '#fef3c7', '#e9d5ff', '#fed7aa']
    },
    forest: {
      base: '#08140e',
      colors: ['#16a34a', '#65a30d', '#ca8a04', '#15803d', '#84cc16', '#22c55e']
    }
  };

  let currentPreset = 'aurora';
  let currentComplexity = 5;
  let currentMesh = null;
  let library = JSON.parse(localStorage.getItem('aurora-library') || '[]');

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function generateMesh(presetName = currentPreset, complexity = currentComplexity) {
    const preset = PRESETS[presetName];
    const gradients = [];
    const usedColors = [];

    for (let i = 0; i < complexity; i++) {
      let color;
      // Try to pick a color we haven't used yet for variety
      for (let attempt = 0; attempt < 5; attempt++) {
        color = preset.colors[Math.floor(Math.random() * preset.colors.length)];
        if (!usedColors.includes(color) || usedColors.length >= preset.colors.length) break;
      }
      usedColors.push(color);

      gradients.push({
        x: Math.round(rand(5, 95)),
        y: Math.round(rand(5, 95)),
        r: Math.round(rand(45, 75)),
        color
      });
    }

    return { base: preset.base, gradients, preset: presetName };
  }

  function meshToBackgroundImage(mesh) {
    return mesh.gradients.map(g =>
      `radial-gradient(circle at ${g.x}% ${g.y}%, ${g.color} 0%, transparent ${g.r}%)`
    ).join(', ');
  }

  function meshToCSS(mesh) {
    const gradients = mesh.gradients.map(g =>
      `radial-gradient(circle at ${g.x}% ${g.y}%, ${g.color} 0%, transparent ${g.r}%)`
    ).join(',\n    ');
    return `background-color: ${mesh.base};\nbackground-image:\n    ${gradients};`;
  }

  function applyMesh(mesh) {
    const canvas = document.getElementById('canvas');
    canvas.style.backgroundColor = mesh.base;
    canvas.style.backgroundImage = meshToBackgroundImage(mesh);
    currentMesh = mesh;
  }

  function newGradient() {
    applyMesh(generateMesh());
  }

  function exportPNG(mesh) {
    const W = 1920, H = 1080;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = mesh.base;
    ctx.fillRect(0, 0, W, H);

    const maxDim = Math.max(W, H);
    mesh.gradients.forEach(g => {
      const cx = (g.x / 100) * W;
      const cy = (g.y / 100) * H;
      const radius = (g.r / 100) * maxDim;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      grad.addColorStop(0, g.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    });

    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `aurora-${mesh.preset}-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');

    showToast('PNG 다운로드를 시작했어요');
  }

  function copyCSSToClipboard(mesh) {
    const css = meshToCSS(mesh);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(css)
        .then(() => showToast('CSS 코드를 복사했어요'))
        .catch(() => fallbackCopy(css));
    } else {
      fallbackCopy(css);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('CSS 코드를 복사했어요');
    } catch (e) {
      showToast('복사에 실패했어요');
    }
    document.body.removeChild(ta);
  }

  function saveCurrent() {
    if (!currentMesh) return;
    library.unshift({ ...currentMesh, id: Date.now() });
    if (library.length > 24) library = library.slice(0, 24);
    persistLibrary();
    renderLibrary();
    showToast('라이브러리에 저장했어요');
  }

  function deleteFromLibrary(id) {
    library = library.filter(m => m.id !== id);
    persistLibrary();
    renderLibrary();
    showToast('삭제했어요');
  }

  function persistLibrary() {
    localStorage.setItem('aurora-library', JSON.stringify(library));
  }

  function renderLibrary() {
    const grid = document.getElementById('library');
    const count = document.getElementById('library-count');
    count.textContent = `${library.length}개의 저장된 그라디언트`;

    if (library.length === 0) {
      grid.innerHTML = `<div class="library-empty">아직 저장된 그라디언트가 없어요.<br/>마음에 드는 걸 만들면 <strong style="color:var(--text)">Save</strong> 버튼으로 저장하세요.</div>`;
      return;
    }

    grid.innerHTML = library.map(mesh => {
      const style = `background-color: ${mesh.base}; background-image: ${meshToBackgroundImage(mesh)};`;
      return `
        <div class="library-item" data-id="${mesh.id}">
          <div class="thumb" style="${style}"></div>
          <div class="actions">
            <button class="icon-btn" data-action="apply" data-id="${mesh.id}" title="적용">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="icon-btn" data-action="png" data-id="${mesh.id}" title="다운로드">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button class="icon-btn danger" data-action="delete" data-id="${mesh.id}" title="삭제">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </div>
      `;
    }).join('');

    grid.querySelectorAll('.icon-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const action = btn.dataset.action;
        const id = parseInt(btn.dataset.id);
        const mesh = library.find(m => m.id === id);
        if (!mesh) return;

        if (action === 'apply') {
          applyMesh(mesh);
          // Sync preset highlight if needed
          document.querySelectorAll('.preset-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.preset === mesh.preset);
          });
          currentPreset = mesh.preset;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          showToast('적용했어요');
        } else if (action === 'png') {
          exportPNG(mesh);
        } else if (action === 'delete') {
          deleteFromLibrary(id);
        }
      });
    });
  }

  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-text').textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // ── Event wiring ─────────────────────────────────────────
  document.getElementById('canvas-wrap').addEventListener('click', newGradient);
  document.getElementById('save-btn').addEventListener('click', saveCurrent);
  document.getElementById('copy-btn').addEventListener('click', () => currentMesh && copyCSSToClipboard(currentMesh));
  document.getElementById('png-btn').addEventListener('click', () => currentMesh && exportPNG(currentMesh));

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPreset = btn.dataset.preset;
      newGradient();
    });
  });

  const complexitySlider = document.getElementById('complexity');
  const complexityValue = document.getElementById('complexity-value');
  complexitySlider.addEventListener('input', e => {
    currentComplexity = parseInt(e.target.value);
    complexityValue.textContent = currentComplexity;
  });
  complexitySlider.addEventListener('change', newGradient);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      newGradient();
    }
  });

  // Fake nav buttons — friendly placeholder behavior
  document.querySelectorAll('[data-fake]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      showToast('곧 출시됩니다');
    });
  });

  // Gently bump the user counter for that lived-in feel
  setInterval(() => {
    const el = document.getElementById('user-count');
    const n = parseInt(el.textContent.replace(/,/g, ''));
    el.textContent = (n + 1).toLocaleString();
  }, 8000);

  // ── Initialize ───────────────────────────────────────────
  newGradient();
  renderLibrary();
</script>
</body>
</html>
